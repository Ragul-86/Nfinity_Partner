<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y04rihkk5i");
</script>

    <!--
      Critical inline styles:
      Paint the background colour and set the base font stack *before* any
      external stylesheet arrives. This eliminates the white/flash-of-unstyled-content
      that causes CLS and a poor LCP baseline on slow connections.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        background-color: #050b16;
        color: #f5f7fa;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100dvh; }
    </style>

    <!-- ── Favicons ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand/favicon-180.png" />

    <!-- ── Meta ─────────────────────────────────────────────────────────── -->
    <meta
      name="description"
      content="Nfinity Partner - Tirupur's #1 Profit-Focused D2C Marketing Agency. Profit First. Revenue Second. ROAS Third."
    />
    <meta name="theme-color" content="#050B16" />
    <meta name="color-scheme" content="dark" />
    <meta name="google-site-verification" content="2UsUd6cY0DPKF5IWPWIXTrvBx2zTdLGTN_Q_PgcKLr8" />
    <title>Nfinity Partner - Scaling Profitability Is The Game.</title>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2280289039450379');
    fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!--
      LCP preload — img1.jpeg is the Largest Contentful Paint element on the
      Home page (hero carousel, above the fold, 558×364 px at desktop).
      Without this hint the browser doesn't discover the image until React
      mounts and renders the <img> tag (~3.4 s). The preload moves the fetch
      to start alongside the JS bundles (~1.1 s), shaving ~2 s from LCP.
      fetchpriority="high" tells the browser to queue this above other images.
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/awards/img1.jpeg"
      fetchpriority="high"
    />

    <!-- ── DNS + connection warm-up ─────────────────────────────────────── -->
    <!--
      preconnect opens the TLS+TCP handshake to Google Fonts early so the
      font CSS (loaded below) arrives faster.  dns-prefetch is the fallback
      for browsers that don't support preconnect.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!--
      Non-blocking font loading:
      `media="print"` makes the browser treat this as a non-render-blocking
      resource. The `onload` handler switches it to `media="all"` once the
      CSS has been downloaded, applying the fonts without delaying first paint.
      The <noscript> fallback handles the rare case where JS is disabled.

      font-display=swap is embedded in the URL so text remains visible in the
      system fallback font during the font swap period (avoids invisible text).
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Meta Pixel noscript fallback — must be in <body>, not <head> -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=2280289039450379&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
